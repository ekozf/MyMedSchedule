name: Release Android

# Manual only: this builds a full native release, which uses a lot of Actions minutes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = from commit messages: feat → minor, breaking → major, otherwise patch)"
        type: choice
        options: [patch, minor, major, auto]
        default: patch

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Only release from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run this workflow from the master branch (got ${GITHUB_REF})."
          exit 1

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Every release must be signed with the same key, or phones can't update the app in place. See docs/releases.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for versioning and release notes

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          prev_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)

          if [ -z "$prev_tag" ]; then
            # First release: use the version already in package.json.
            next=$(node -p "require('./package.json').version")
            range="HEAD"
            echo "No earlier release tag. First release is v${next}."
          else
            range="${prev_tag}..HEAD"
            if [ -z "$(git rev-list "$range")" ]; then
              echo "::error::No new commits since ${prev_tag}. Nothing to release."
              exit 1
            fi
            IFS=. read -r major minor patch <<<"${prev_tag#v}"
            bump="$BUMP"
            if [ "$bump" = auto ]; then
              log=$(git log --no-merges --format='%s%n%b' "$range")
              if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<<"$log"; then
                bump="major"
              elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then
                bump="minor"
              else
                bump="patch"
              fi
              echo "Auto bump picked: ${bump}"
            fi
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="${major}.${minor}.${patch}"
          fi

          IFS=. read -r major minor patch <<<"$next"
          {
            echo "version=${next}"
            echo "tag=v${next}"
            echo "prev_tag=${prev_tag}"
            echo "range=${range}"
            # Android needs a growing integer; this stays ordered for any semver bump.
            echo "code=$((major * 1000000 + minor * 1000 + patch))"
          } >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::Tag v${next} already exists."
            exit 1
          fi

      # --- Tests gate the release, same as CI ---
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run

      # --- Android build ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --console=plain \
            -PappVersionName=${{ steps.version.outputs.version }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Prepare and verify artifacts
        id: artifacts
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          apk="MyMedSchedule-${tag}.apk"
          aab="MyMedSchedule-${tag}.aab"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${apk}"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/${aab}"
          (cd dist && sha256sum "${apk}" > "${apk}.sha256" && sha256sum "${aab}" > "${aab}.sha256")

          # Fail if either artifact isn't signed with the release (upload) key.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk_cert=$("$apksigner" verify --print-certs "dist/${apk}")
          head -3 <<<"$apk_cert"
          # (No -strict: a self-signed upload certificate is expected and would fail it.)
          jarsigner -verify "dist/${aab}" > "$RUNNER_TEMP/jarsigner.log" 2>&1 || { cat "$RUNNER_TEMP/jarsigner.log"; exit 1; }
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner.log" || { cat "$RUNNER_TEMP/jarsigner.log"; exit 1; }
          # The AAB must not be signed with the Android debug certificate.
          aab_cert=$(keytool -printcert -jarfile "dist/${aab}")
          if grep -q "CN=Android Debug" <<<"$aab_cert"; then
            echo "::error::AAB is signed with the debug key."
            exit 1
          fi
          grep -E "Owner:|SHA256:" <<<"$aab_cert" || true

          {
            echo "apk_name=${apk}"
            echo "apk_sha256=$(cut -d' ' -f1 "dist/${apk}.sha256")"
            echo "apk_size=$(du -h "dist/${apk}" | cut -f1)"
            echo "aab_name=${aab}"
            echo "aab_sha256=$(cut -d' ' -f1 "dist/${aab}.sha256")"
            echo "aab_size=$(du -h "dist/${aab}" | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      # Convenience copy for uploading to Google Play by hand. Native debug symbols and the
      # R8 mapping file are inside the AAB (BUNDLE-METADATA), so Play picks them up automatically.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMedSchedule-${{ steps.version.outputs.tag }}-aab
          path: |
            dist/${{ steps.artifacts.outputs.aab_name }}
            dist/${{ steps.artifacts.outputs.aab_name }}.sha256
          if-no-files-found: error

      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          RANGE: ${{ steps.version.outputs.range }}
          APK_NAME: ${{ steps.artifacts.outputs.apk_name }}
          APK_SHA: ${{ steps.artifacts.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.artifacts.outputs.apk_size }}
          AAB_NAME: ${{ steps.artifacts.outputs.aab_name }}
          AAB_SHA: ${{ steps.artifacts.outputs.aab_sha256 }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          fmt="- %s ([\`%h\`](${REPO_URL}/commit/%H)) by %an"
          section() { # $1 = heading, $2 = subject regex (extended), $3 = "-v" to invert the match
            local lines
            lines=$(git log --no-merges --format="$fmt" "$RANGE" | grep -E "${3:--e}" "^- ($2)" || true)
            if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          types='feat|fix|perf|refactor|docs|test|chore|ci|build|style|revert'

          {
            echo "## Download"
            echo
            echo "**[⬇️ ${APK_NAME}](${REPO_URL}/releases/download/${TAG}/${APK_NAME})** (${APK_SIZE})"
            echo
            echo "Open that link on your Android phone, then tap the downloaded file to install."
            echo "The first time, Android asks you to allow installs from your browser or file manager."
            echo "Installing over an earlier release keeps your data."
            echo
            echo "\`${AAB_NAME}\` is the Android App Bundle for Google Play. Phones can't install it directly."
            echo
            echo "## Changes"
            echo
            section "Features" "feat(\\([^)]*\\))?!?:"
            section "Fixes" "fix(\\([^)]*\\))?!?:"
            section "Performance" "perf(\\([^)]*\\))?!?:"
            section "Maintenance" "(refactor|docs|test|chore|ci|build|style|revert)(\\([^)]*\\))?!?:"
            section "Other" "(${types})(\\([^)]*\\))?!?:" -v
            if [ -n "$PREV_TAG" ]; then
              echo "**Full changelog:** ${REPO_URL}/compare/${PREV_TAG}...${TAG}"
              echo
            fi
            echo "<details><summary>SHA-256</summary>"
            echo
            echo "- \`${APK_NAME}\`: \`${APK_SHA}\`"
            echo "- \`${AAB_NAME}\`: \`${AAB_SHA}\`"
            echo
            echo "</details>"
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.artifacts.outputs.apk_name }}
          AAB_NAME: ${{ steps.artifacts.outputs.aab_name }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "MyMedSchedule ${TAG}" \
            --notes-file release-notes.md \
            --latest \
            "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" \
            "dist/${AAB_NAME}" "dist/${AAB_NAME}.sha256"
